name: Deploy Laravel POS Multitenant to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Executing remote SSH commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Iniciando despliegue automático en el VPS..."
            cd ${{ secrets.VPS_TARGET_DIR }}
            
            echo "📥 Obteniendo cambios de GitHub..."
            git pull origin main
            
            echo "📦 Instalando dependencias de Composer..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "🗄️ Ejecutando migraciones de base de datos..."
            php artisan migrate --force
            
            echo "🧹 Limpiando y optimizando caché de Laravel..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            php artisan cache:clear
            
            echo "✅ ¡Despliegue completado con éxito!"
